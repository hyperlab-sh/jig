name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      run-all:
        description: Run every job regardless of changed paths (used by release workflows)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '!docs/**'

  lint:
    needs: changes
    # run-all: paths-filter diffs against the default branch or the last commit on non-PR events,
    # which can be empty (tag on a commit already in main) and would skip every job on a release.
    if: inputs.run-all || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run lint

  typecheck:
    needs: changes
    # run-all: paths-filter diffs against the default branch or the last commit on non-PR events,
    # which can be empty (tag on a commit already in main) and would skip every job on a release.
    if: inputs.run-all || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  test:
    needs: changes
    # run-all: paths-filter diffs against the default branch or the last commit on non-PR events,
    # which can be empty (tag on a commit already in main) and would skip every job on a release.
    if: inputs.run-all || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run quick:test

  build:
    needs: changes
    # run-all: paths-filter diffs against the default branch or the last commit on non-PR events,
    # which can be empty (tag on a commit already in main) and would skip every job on a release.
    if: inputs.run-all || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run build

  # Single stable required check: passes when jobs were skipped (docs-only change) or succeeded.
  ci:
    if: always()
    needs: [changes, lint, typecheck, test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
