name: release

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to release
        type: choice
        required: true
        options:
          - lexer
          - parser
          - jig
      dry-run:
        description: Dry run (no commit, tag, push or publish)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      run-all: true

  release:
    needs: checks
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: release
    permissions:
      contents: write
      # npm trusted publishing (OIDC) and provenance; no npm token is stored.
      id-token: write
    steps:
      # The deploy key is a bypass actor on the main ruleset, so release-it
      # can push the release commit and tag; GITHUB_TOKEN pushes are rejected.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check npm supports trusted publishing
        run: |
          v=$(npm --version)
          if [ "$(printf '%s\n' 11.5.1 "$v" | sort -V | head -1)" != 11.5.1 ]; then
            echo "npm $v is too old for trusted publishing (needs >= 11.5.1)" >&2
            exit 1
          fi
      - run: bun install --frozen-lockfile
      - name: Build workspace libs (needed by the version script of parser and jig)
        run: bun run build:libs
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: ${{ inputs.package }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          args=(--ci)
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
            # A dry run skips the before:npm:release hook but still runs
            # npm publish --dry-run, so the tarball has to exist up front.
            bun run --cwd "packages/$PACKAGE" pack:release
          fi
          bun run --cwd "packages/$PACKAGE" release -- "${args[@]}"
